# i3blocks configuration file
#
# The i3blocks man page describes the usage of the binary,
# and its website describes the configuration:
#
#     https://vivien.github.io/i3blocks


# Global properties
separator=true
separator_block_width=15
color=#d3d7cf
defaultColourFG=#d3d7cf
defaultColourBG=#2e3436

[pdfcompiling]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_pdfcompiling.sh
interval=3
signal=5

[player]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_player.sh
interval=10
signal=10

[volume]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_volume.sh
interval=10
signal=20

[wifi]
command=zsh /home/$USER/myConfigFiles/i3blockscripts/blocks_wifi.sh
interval=10
signal=30

[ethernet]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_ethernet.sh
interval=10

[vpn]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_vpn.sh
interval=10

[hostname]
full_text=<span bgcolor="#d3d7cf"> <span color="#2e3436">on</span> <b><span color="#06989a">P1</span></b> </span>
markup=pango
interval=once

[fan]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_fan.sh
interval=30

[battery]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_battery.sh state
interval=20
separator=false
separator_block_width=3
signal=15

[batteryCharge]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_battery.sh charging
interval=20
color=#00ff00
separator_block_width=0
signal=15

[batteryDischarge]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_battery.sh discharging
interval=20
color=#ff0000
separator_block_width=0
signal=15

[batteryRemain]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_battery.sh remain
interval=20
separator_block_width=0
signal=15

[batterySeparator]
full_text=" "
interval=once
separator=true

[time]
command=/home/$USER/myConfigFiles/i3blockscripts/blocks_date.sh
interval=1
